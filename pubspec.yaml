name: blastsafe
description: BlastSafe - Aplikasi informasi dan monitoring lokasi perlindungan pada kondisi darurat banjir

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  intl: ^0.20.0
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  firebase_core: ^2.30.0
  geolocator: ^12.0.0
  image_picker: ^1.2.2
  video_player: ^2.11.1
  chewie: ^1.7.1
  cached_network_image: ^3.4.1

  # Database lokal SQLite
  sqflite: ^2.3.2
  path: ^1.9.0

  # Push notification lokal
  flutter_local_notifications: ^17.2.2

  # HTTP request API
  http: ^1.2.1

  # UTAMA: Gunakan supabase_flutter saja untuk menghindari konflik parameter
  supabase_flutter: ^2.12.4

  shimmer: ^3.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
